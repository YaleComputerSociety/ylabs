approvedGitRepositories: []

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 1d

# Advisory suppressions (audit gate). Keep each entry scoped to a single advisory
# id with a justification and an exit condition, and revisit on dependency bumps.
npmAuditIgnoreAdvisories:
  # http-cache-semantics GHSA-ch52-4w7c-c8xp (npm 1240991): max-stale handling can let a
  # shared cache serve one user's stored response to another. No patched release exists
  # (every version through 4.2.0 is affected). The only consumer is the scraper's
  # httpValidatorCache, which builds policies with shared: false for its own outbound
  # fetches and never calls satisfiesWithoutRevalidation or the package's freshness or
  # max-stale logic. Its #6212 reuse window reads only its own verification time and the
  # stored Cache-Control, and refuses no-store, private, credentialed requests and any Vary
  # but Accept-Encoding (httpValidatorCache.test.ts: "never reuses a body whose stored
  # response is no-store or private", "never stores or reuses a request that carries
  # credentials", "never reuses a response that varies on anything but its encoding"). The
  # cache is owner-only on local disk, reused only by this machine's own scraper processes,
  # never stored in Mongo and never served to a site user. Remove this entry
  # when a patched http-cache-semantics is published and adopted.
  - "1240991"
