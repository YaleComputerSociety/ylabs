approvedGitRepositories:
  - "https://github.com/coursetable/passport-cas"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 1d

# Advisory suppressions (audit gate). Keep each entry scoped to a single advisory
# id with a justification and an exit condition, and revisit on dependency bumps.
npmAuditIgnoreAdvisories:
  # GHSA-ch52-4w7c-c8xp (http-cache-semantics max-stale cross-user disclosure, id 1240991).
  # Not applicable: the server uses it only in the scraper's outbound validator cache of
  # anonymous public-page fetches, which bypasses requests carrying authorization or cookie
  # headers and never serves a cached response to a user. No patched release exists (4.2.0 is
  # the latest and is in range). Remove this entry once a fixed release is published.
  - "1240991"
  # GHSA-vfj7-8cjw-p6xm (braces stack exhaustion through deeply nested patterns, id 1240992).
  # Not applicable: no lockfile here contains braces since the tailwindcss 4 upgrade (#4438);
  # branches that predate it reach it only through client build tooling (chokidar, micromatch),
  # which expands glob patterns authored in this repository, never a pattern from a user. No
  # patched release exists (3.0.3 is the latest and is in range). Remove this entry once a fixed
  # release is published or no open branch predates #4438.
  - "1240992"
