name: E2E Smoke

on:
  pull_request:
    branches:
      - main
      - beta
  # Post-merge signal on the commit that actually lands on beta, since the beta
  # ruleset does not require branches to be up to date (#3913). Not a merge gate.
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

# Only push runs share a group, so a burst of merges only tests the newest beta
# head. Every other run gets its own group and is neither queued nor cancelled,
# because a cancelled run reports as a non-success on a required context.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  student-journey-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      meilisearch:
        image: getmeili/meilisearch:v1.13
        ports:
          - 7700:7700
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: e2e-smoke-meili-${{ github.run_id }}-${{ github.run_attempt }}
          MEILI_NO_ANALYTICS: 'true'

    env:
      NODE_ENV: development
      PORT: '4000'
      SERVER_BASE_URL: http://localhost:4000
      # Built per run so no credential-shaped literal is committed (#4198).
      SESSION_SECRET: e2e-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      MONGODBURL: mongodb://localhost:27017/ylabs_e2e_smoke
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: e2e-smoke-meili-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .node-version is the single declaration of the runtime major, read here
      # and by the hosting provider, so CI and the deployed service cannot drift
      # apart (#3915).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Node 25 removed Corepack from the distribution, so `corepack enable` alone exits
      # non-zero on a current runner and the install dies before any test runs. The
      # preinstalled Yarn 1 does not delegate on its own either. `packageManager` in the
      # root package.json stays the single source of truth for the Yarn version (#3216).
      # The version is pinned rather than @latest so a new Corepack release cannot
      # change the tool that selects Yarn between two runs of the same commit (#3915).
      - name: Install Corepack
        run: npm install -g corepack@0.36.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfiles
        run: |
          yarn install --immutable
          yarn --cwd server install --immutable
          yarn --cwd client install --immutable

      - name: Build client
        run: yarn build:client

      - name: Wait for Meilisearch readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:7700/health >/dev/null; then
              echo "Meilisearch is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Meilisearch did not become ready in time"
          exit 1

      - name: Seed synthetic research entities
        run: yarn --cwd server e2e:seed-smoke

      - name: Rebuild Meilisearch index from seeded entities
        run: yarn --cwd server meili:rebuild-research-entities --clear --confirm-meili-rebuild

      - name: Start API and static client
        run: |
          nohup yarn --cwd server exec tsx src/index.ts > /tmp/e2e-server.log 2>&1 &
          echo $! > /tmp/e2e-server.pid
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:4000/api/check >/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time"
          cat /tmp/e2e-server.log || true
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run student-journey smoke
        run: node scripts/e2e-student-journey-smoke.mjs

      - name: Run merge-tombstone smoke
        run: node scripts/e2e-merge-tombstone-smoke.mjs

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/e2e-server.log || true
