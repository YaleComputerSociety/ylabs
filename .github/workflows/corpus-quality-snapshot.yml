name: Corpus Quality Snapshot

# Records one dated coverage-and-quality measurement so the admin dashboard can
# show a trend rather than only a current state.
#
# Manual trigger only, deliberately. A schedule needs a DEV_MONGODBURL secret,
# and this repository has none configured; adding one that reaches a
# student-facing database is an owner's decision, not a default. Until it
# exists, a `schedule:` block here would fail on every tick or, worse, look
# configured while never producing a measurement. Uncomment the schedule in the
# same change that adds the secret.
#
# on:
#   schedule:
#     - cron: '17 6 * * *' # 06:17 UTC daily

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to measure (must match the database the secret points at)
        required: true
        default: development
        type: choice
        options:
          - development
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: corpus-quality-snapshot-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: corpus-quality-snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      # Invoke the immutable installs as yarn builtins rather than via the
      # install:all:immutable script: on a fresh checkout Yarn cannot run
      # package.json scripts before an install has created its state file.
      - name: Install dependencies from lockfiles
        run: |
          yarn install --immutable
          yarn --cwd server install --immutable

      # Fail loudly rather than recording nothing. A snapshot job that exits 0
      # without writing a row is the failure this whole measurement exists to
      # stop: a green signal that was never exercised.
      - name: Require a database URL
        env:
          DEV_MONGODBURL: ${{ secrets.DEV_MONGODBURL }}
        run: |
          if [ -z "${DEV_MONGODBURL}" ]; then
            echo "DEV_MONGODBURL is not configured, so no measurement can be taken." >&2
            exit 1
          fi

      - name: Record the snapshot
        env:
          MONGODBURL: ${{ secrets.DEV_MONGODBURL }}
        run: yarn --cwd server corpus:snapshot --environment "${{ inputs.environment }}"
