name: Post-Promotion Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit:
        description: Commit prefix production is expected to serve
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: post-promotion-verify
  cancel-in-progress: false

jobs:
  verify:
    name: post-promotion-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfiles
        run: |
          yarn install --immutable
          yarn --cwd server install --immutable
          yarn --cwd client install --immutable

      - name: Wait for production to serve the promoted commit
        id: wait
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_FINGERPRINT_TOKEN }}
          EXPECT_COMMIT: ${{ inputs.commit }}
        run: |
          set -uo pipefail

          expected="${EXPECT_COMMIT:-${GITHUB_SHA:0:7}}"
          echo "expected=${expected}" >>"$GITHUB_OUTPUT"

          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::DEPLOYMENT_FINGERPRINT_TOKEN is not configured, so the promoted commit cannot be verified."
            exit 1
          fi

          for attempt in $(seq 1 90); do
            served=$(curl -fsS -H "X-Deployment-Token: ${DEPLOYMENT_TOKEN}" \
              https://yalelabs.io/api/deployment 2>/dev/null | jq -r '.gitCommit // empty')
            case "$served" in
              "${expected}"*)
                echo "Production is serving ${expected} after ${attempt} attempt(s)."
                exit 0
                ;;
            esac
            sleep 20
          done

          echo "::error::Production never served ${expected} within the deploy window."
          exit 1

      - name: Run production security smoke against the promoted commit
        env:
          SMOKE_API_BASE: https://yalelabs.io/api
          SMOKE_APP_BASE: https://yalelabs.io
          SMOKE_EXPECT_COMMIT: ${{ steps.wait.outputs.expected }}
          SMOKE_DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_FINGERPRINT_TOKEN }}
        run: |
          set +e
          yarn security:smoke:production --expect-commit "$SMOKE_EXPECT_COMMIT"
          status=$?
          if [ -f tmp/ui-smoke/production-promotion-smoke-report.json ]; then
            cat tmp/ui-smoke/production-promotion-smoke-report.json
          fi
          exit "$status"
