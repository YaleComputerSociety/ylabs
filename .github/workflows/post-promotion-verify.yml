name: Post-Promotion Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-promotion-verify
  cancel-in-progress: false

jobs:
  verify:
    name: post-promotion-verify
    runs-on: ubuntu-latest
    # Installs plus the fixed 180s rollout wait plus the smoke; the observed run
    # is well under this, and the default 360-minute ceiling is no bound at all.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .node-version is the single declaration of the runtime major, read here
      # and by the hosting provider, so CI and the deployed service cannot drift
      # apart (#3915).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Node 25 removed Corepack from the distribution, so `corepack enable` alone exits
      # non-zero on a current runner and the install dies before any test runs. The
      # preinstalled Yarn 1 does not delegate on its own either. `packageManager` in the
      # root package.json stays the single source of truth for the Yarn version (#3216).
      # The version is pinned rather than @latest so a new Corepack release cannot
      # change the tool that selects Yarn between two runs of the same commit (#3915).
      - name: Install Corepack
        run: npm install -g corepack@0.36.0

      - name: Enable Corepack
        run: corepack enable

      # Invoke the immutable installs as yarn builtins, not via the
      # install:all:immutable script: on a fresh checkout Yarn cannot run
      # package.json scripts before an install has created its state file
      # ("Couldn't find the node_modules state file"), so the script form
      # fails on every CI runner.
      - name: Install dependencies from lockfiles
        run: |
          yarn install --immutable
          yarn --cwd server install --immutable
          yarn --cwd client install --immutable

      # Render deploys main asynchronously, so give the rollout time to land
      # before asserting against production. Which commit is live is read from
      # the Render deploy log, not from the app.
      - name: Wait for the Render rollout
        run: sleep 180

      - name: Run production security smoke
        env:
          SMOKE_API_BASE: https://yalelabs.io/api
          SMOKE_APP_BASE: https://yalelabs.io
        run: |
          set +e
          yarn security:smoke:production
          status=$?
          if [ -f tmp/ui-smoke/production-promotion-smoke-report.json ]; then
            cat tmp/ui-smoke/production-promotion-smoke-report.json
          fi
          exit "$status"
