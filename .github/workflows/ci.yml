name: CI

on:
  pull_request:
    branches:
      - main
      - beta
  # The beta merge queue gates on this run: it tests the exact squash commit
  # that lands, on top of every queued pull request ahead of it (#4512). The
  # required contexts never report on a queued group without this trigger, so
  # removing it stalls every merge.
  merge_group:
    types:
      - checks_requested
  # Post-merge signal on the landed commit, kept as a safety net for anything
  # that reaches beta outside the queue (#3913). It is not a merge gate.
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

# Only push runs share a group, so a burst of merges only tests the newest beta
# head. Every other run gets its own group and is neither queued nor cancelled,
# because a cancelled run reports as a non-success on a required context.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Operator escape hatch for an advisory-registry outage. Absent or anything
    # other than "1" leaves the audit failing closed, so the default stays strict
    # and turning it on is a deliberate, revocable act recorded in repo settings
    # rather than an --admin merge that bypasses every other check too.
    # Set repository variable ALLOW_UNREACHABLE_ADVISORY_AUDIT=1 to use it, and
    # unset it the moment the registry is healthy again.
    env:
      DEPENDENCY_AUDIT_ALLOW_UNREACHABLE: ${{ vars.ALLOW_UNREACHABLE_ADVISORY_AUDIT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .node-version is the single declaration of the runtime major, read here
      # and by the hosting provider, so CI and the deployed service cannot drift
      # apart (#3915).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Node 25 removed Corepack from the distribution, so `corepack enable` alone exits
      # non-zero on a current runner and the install dies before any test runs. The
      # preinstalled Yarn 1 does not delegate on its own either. `packageManager` in the
      # root package.json stays the single source of truth for the Yarn version (#3216).
      # The version is pinned rather than @latest: an unpinned install lets a new
      # Corepack release change the tool that selects Yarn between two runs of the
      # same commit, and break every workflow at once (#3915).
      - name: Install Corepack
        run: npm install -g corepack@0.36.0

      - name: Enable Corepack
        run: corepack enable

      # Invoke the immutable installs as yarn builtins, not via the
      # install:all:immutable script: on a fresh checkout Yarn cannot run
      # package.json scripts before an install has created its state file
      # ("Couldn't find the node_modules state file"), so the script form
      # fails on every CI runner.
      - name: Install dependencies from lockfiles
        run: |
          yarn install --immutable
          yarn --cwd server install --immutable
          yarn --cwd client install --immutable

      - name: Check formatting
        run: yarn format:check

      # Errors block; warnings do not. `yarn lint` sets no warning ceiling, so
      # ESLint's unlimited default applies and only an error exits non-zero.
      # Deliberate (ylabs#3070): this gates the class that actually reached beta
      # and cannot be defeated by warning drift. Placed ahead of the suites
      # because a lint error costs seconds to report and the tests cost minutes.
      # Changing this order also requires updating the step list in
      # skills/finishing-work/SKILL.md, which readers follow to predict CI.
      - name: Run ESLint (errors block, warnings advisory)
        run: yarn lint

      - name: Run server typecheck
        run: npx tsc --noEmit -p server/tsconfig.json

      # A step inside test-and-build rather than a separate job, so it reports
      # under the required `test-and-build` context. A new job would report under
      # a new context name that no ruleset requires, and so could not block a
      # merge until someone added it to the ruleset.
      - name: Run client typecheck
        run: npx tsc --noEmit -p client/tsconfig.json

      # Registration and inventory guards report in seconds, so they run ahead of
      # the full server suite, which still runs them again (#3737). Changing this
      # order also requires updating the step list in skills/finishing-work/SKILL.md.
      - name: Run server guard tests
        run: yarn --cwd server test:guards

      - name: Run server tests
        run: yarn --cwd server test

      - name: Run model inventory operator tests
        run: yarn model-refactor:inventory:test-operator-tools

      - name: Run data profile safety tests
        run: yarn test:data-profiles

      - name: Run every scripts test suite
        run: yarn test:scripts

      - name: Run client tests
        run: yarn --cwd client test:ci

      - name: Run deploy security preflight
        run: yarn security:preflight

      - name: Check moderate all-environment dependency advisories
        env:
          DEPENDENCY_AUDIT_VERDICT_FILE: ${{ runner.temp }}/advisory-verdict.json
        run: yarn security:audit:all-environments

      # Publishes the advisory verdict (clean / advisories_found /
      # registry_unreachable) as an artifact a merge consumer can read, so exit 1
      # and exit 75 are distinguishable after the fact - both otherwise collapse to
      # one `failure` on this check. `if: always()` because the unreachable and
      # advisories-found cases are exactly the ones where the step above exits
      # non-zero. This is informational only: the required check failing is what
      # blocks a merge, never this artifact (ylabs#2381).
      - name: Publish advisory verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisory-verdict
          path: ${{ runner.temp }}/advisory-verdict.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build server and client
        run: yarn build
