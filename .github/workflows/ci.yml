name: CI

on:
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      # Invoke the immutable installs as yarn builtins, not via the
      # install:all:immutable script: on a fresh checkout Yarn cannot run
      # package.json scripts before an install has created its state file
      # ("Couldn't find the node_modules state file"), so the script form
      # fails on every CI runner.
      - name: Install dependencies from lockfiles
        run: |
          yarn install --immutable
          yarn --cwd server install --immutable
          yarn --cwd client install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Run server typecheck
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Run server tests
        run: yarn --cwd server test

      - name: Run model inventory operator tests
        run: yarn model-refactor:inventory:test-operator-tools

      - name: Run data profile safety tests
        run: yarn test:data-profiles

      - name: Run client tests
        run: yarn --cwd client test:ci

      - name: Run deploy security preflight
        run: yarn security:preflight

      - name: Check moderate all-environment dependency advisories
        # Audits every workspace before failing. Under the default `bash -e` the
        # three commands aborted at the first failing one, so advisories in a
        # later workspace stayed invisible: two HIGH client advisories sat behind
        # a moderate server one, and fixing the server first surfaced them as a
        # fresh red that read like a regression (#2371).
        run: |
          status=0
          for workspace in . server client; do
            echo "::group::dependency advisories: ${workspace}"
            (cd "${workspace}" && yarn npm audit --recursive --severity moderate) || status=1
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Build server and client
        run: yarn build
