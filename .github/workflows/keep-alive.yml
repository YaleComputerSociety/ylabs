name: Keep Alive

on:
  schedule:
    # Best-effort only. GitHub drops and delays scheduled runs under load, and
    # this cron has been observed delivering roughly 6 to 7 runs a day rather
    # than 144, so treat a red run as a signal about beta and never treat a
    # green history as proof beta stayed warm between runs (#3910).
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Ping the beta service
        env:
          # The service root, not an API route: a 2xx here means the instance
          # answered, which is what warmth is. A data-backed route like
          # /api/config mixes corpus and database health into the signal, so a
          # red run would stop meaning "beta is cold".
          BETA_HEALTH_URL: https://ylabs-gr4v.onrender.com/
        run: scripts/keep-alive-probe.sh
