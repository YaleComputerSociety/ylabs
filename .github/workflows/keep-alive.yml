name: Keep Alive

on:
  schedule:
    # Best-effort only. GitHub drops and delays scheduled runs under load, and
    # this cron has been observed delivering roughly 6 to 7 runs a day rather
    # than 144, so treat a red run as a signal about beta and never treat a
    # green history as proof beta stayed warm between runs (#3910).
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the beta API
        env:
          BETA_HEALTH_URL: https://ylabs-gr4v.onrender.com/api/config
        run: |
          set -uo pipefail
          attempts=3
          status=000
          for attempt in $(seq 1 "$attempts"); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BETA_HEALTH_URL")
            echo "attempt ${attempt}/${attempts}: HTTP ${status}"
            case "$status" in
              2*) echo "beta answered HTTP ${status}"; exit 0 ;;
            esac
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 20
            fi
          done
          echo "::error::${BETA_HEALTH_URL} did not answer 2xx after ${attempts} attempts (last HTTP ${status})"
          exit 1
