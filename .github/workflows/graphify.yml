name: Graphify Cache

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphify-cache:
    name: Verify deterministic Graphify cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5cdd44f624160c9d7a8466cb3a78c141 # v4.4.0
        with:
          node-version: 20

      - name: Test cache freshness logic
        run: node --test scripts/graphify-cache.test.mjs

      - name: Validate generated-file policy
        run: node scripts/graphify-cache.mjs policy

      - name: Install pinned Graphify
        run: |
          python3 -m venv /tmp/ylabs-graphify-ci
          /tmp/ylabs-graphify-ci/bin/python -m pip install --disable-pip-version-check "graphifyy==$(cat .graphify-version)"

      - name: Generate Graphify cache twice
        run: PATH="/tmp/ylabs-graphify-ci/bin:$PATH" node scripts/graphify-cache.mjs verify

      - name: Upload Graphify cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-${{ github.sha }}
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 14
