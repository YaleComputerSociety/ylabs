name: Release Hold

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft]
    branches:
      - main

# pull-requests: read is what lets the job read the pull request's live label
# and draft state. github.event is a frozen copy of the payload that started the
# run, so a re-run of an earlier attempt would otherwise clear a hold that is
# still in effect (#3911).
permissions:
  contents: read
  pull-requests: read

jobs:
  hold:
    name: release-hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Block while a release hold is in effect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_REPO: ${{ github.repository }}
        run: scripts/release-hold-check.sh
