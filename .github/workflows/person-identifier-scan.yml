name: Person identifier scan

# Deliberately not a required check: a workflow cannot stop a body from being
# created, and adding `edited` to ci.yml's trigger would rerun the whole
# test-and-build job on every body tweak. The blocking arm of this convention is
# `yarn security:identifiers` inside security:preflight, which fails the required
# check on a committed dump.
#
# This job nevertheless FAILS on a flagged body rather than reporting its verdict
# only in a comment. It used to succeed either way, and that made a green
# `gh pr checks` read as "the body is clean" to every automated merge path, which
# is how two gate-authored bodies naming a person reached `beta` (#2953). The
# failure cannot unpublish the text; it exists so nobody merges past the finding
# believing it was never raised.
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      # Written from the event payload via the environment rather than
      # interpolated into a run block, so a body containing shell
      # metacharacters cannot alter the command.
      - name: Write body to a file
        env:
          BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"

      - name: Scan the body
        id: scan
        env:
          LABEL: ${{ github.event.issue.number && 'issue body' || 'pull request body' }}
        run: |
          set +e
          node scripts/check-no-person-identifiers.mjs \
            --body-file "$RUNNER_TEMP/body.txt" --label "$LABEL" > "$RUNNER_TEMP/scan.txt" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/scan.txt"

      # The report names rules and counts only. The detector never echoes the
      # identifier it matched, so this comment cannot republish the thing the
      # convention exists to keep out of the tracker.
      - name: Comment and fail when the body names a person
        if: steps.scan.outputs.exit_code != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/scan.txt`, 'utf8');
            const marker = '<!-- person-identifier-scan -->';
            const body = [
              marker,
              'This body makes a claim about an identifiable person. This repository is',
              'public, and editing a body later does not remove the text: GitHub serves',
              'every prior revision to anyone, with no account required. Please rewrite',
              'before the text settles.',
              '',
              'The harm is the pairing, not the name. A public directory URL cited as',
              'evidence that a link resolves is reported as a note and is fine; a person',
              'named next to `departed`, `suppressed` or a defect judgement is the finding.',
              'State the claim about a predicate instead: "the 12 rows where',
              '`manuallyLockedFields` contains `activeAtYaleCache`" rather than a list of',
              'slugs or names. See `docs/person-identifier-convention.md`.',
              '',
              'Check a draft before posting: `yarn security:identifiers:body <file>`.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              'If a literal identifier is genuinely required, add a line reading',
              '`identifier-exempt: <reason>`.',
            ].join('\n');

            const issue_number = Number(process.env.NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

            core.setFailed(
              'This body makes a claim about an identifiable person. Rewrite it by predicate.' +
                ' The original revision stays public, so this failure is a notice, not a gate to' +
                ' wait on. A Title Case product phrase matched as a name is a comment and a merge' +
                ' on the red, never an identifier-exempt line.',
            );
