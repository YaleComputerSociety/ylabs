<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --yr-blue: #00356b;
        --yr-blue-soft: #e6edf5;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 64px;
        background: var(--yr-blue);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
      }

      .wordmark {
        font-size: 184px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .wordmark-slash {
        display: inline-block;
        font-weight: 500;
        margin: 0 0.02em;
        transform: scaleY(1.32);
      }

      .tagline {
        margin: 0;
        color: var(--yr-blue-soft);
        font-size: 40px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="wordmark">y<span class="wordmark-slash">/</span>labs</div>
    <p class="tagline">Find labs, centers, and programs at Yale</p>
  </body>
</html>
