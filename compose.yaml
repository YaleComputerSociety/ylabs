name: ylabs

services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: ylabs-meilisearch
    restart: unless-stopped
    ports:
      - '127.0.0.1:7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local_development_master_key
    volumes:
      - meili_data:/meili_data

  mongodb:
    image: mongo:7
    container_name: ylabs-mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  meili_data:
  mongo_data:
